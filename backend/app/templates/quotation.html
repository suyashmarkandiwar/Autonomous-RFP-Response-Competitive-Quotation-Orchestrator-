<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            font-size: 14px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .summary {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Commercial Quotation</h2>
        <p>Prepared for: <strong>{{ client_name }}</strong></p>
    </div>

    <div class="summary">
        <h3>Executive Summary</h3>
        <!-- We use safe so HTML bullet points render correctly -->
        {{ executive_summary | safe }}
    </div>

    <h3>Line Items</h3>
    <table>
        <tr>
            <th>Item Name</th>
            <th>Qty</th>
            <th>Unit Price (₹)</th>
            <th>Total (₹)</th>
        </tr>
        {% for item in parsed_items %}
        <tr>
            <td>{{ item.item_name }}</td>
            <td>{{ item.qty }}</td>
            <td>{{ item.quoted_unit_price }}</td>
            <td>{{ item.total_price }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
